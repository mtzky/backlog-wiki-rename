plugins {
    id 'latest-wrapper'
    id 'java-conventions'
    id 'application'
    id 'co.uzzu.dotenv.gradle' version '4.0.0'
}

dependencies {
    implementation 'com.nulab-inc:backlog4j:2.7.0'
    runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.18'
}

application {
    mainClass.set('org.mtzky.backlog.wiki.Rename')
}

['Rename', 'CheckDeadLink'].forEach { name ->
    tasks.register("run${name}", JavaExec) {
        it.description = "Runs ${name} as a JVM application"
        it.group = ApplicationPlugin.APPLICATION_GROUP
        classpath = sourceSets.main.runtimeClasspath
        mainClass.set("org.mtzky.backlog.wiki.${name}")
    }
}

tasks.withType(JavaExec).configureEach {
    environment << env.allVariables()
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'java.util.logging.config.file', file('src/conf/logging.properties')
}

tasks.withType(Test).configureEach {
    environment << env.allVariables()
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'java.util.logging.config.file', file('src/conf/logging-test.properties')
    systemProperty 'org.mtzky.backlog.wiki.mapping.file', file('src/conf/mapping-test.properties')
}
